<!doctype html>
<html data-deployment-page="12" data-refinement="12" lang="zh-CN">
<head>
<meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061528">
  <meta name="description" content="西安星旭新能源科技有限公司需求反馈表">
  <title>需求反馈｜星旭能源科技</title>
  <link rel="icon" href="/assets/1add60395ee22acc50a830f5.png" type="image/png">
  <link rel="stylesheet" href="/assets/f1b1be645a1d29c7234437e2.css">
<link rel="stylesheet" href="/assets/ad5782093c74b052c8df7049.css"><link rel="stylesheet" href="/assets/2e77da91424f486154f0a047.css"><meta name="robots" content="noindex,nofollow">
</head>
<body class="functional-body feedback-body">
  <main class="functional-page feedback-detail" aria-labelledby="feedback-title">
    <img class="page-image" src="/assets/0ea704a67eeffc5585ef9b6e.png" alt="工程人员在能源系统建模与仿真环境中沟通需求">
    <div class="page-shade" aria-hidden="true"></div>

    <header class="functional-brand">
      <div class="brandmark"><img src="/assets/1add60395ee22acc50a830f5.png" alt="星旭能源科技标志"></div>
      <div class="brandname"><strong>星旭能源科技</strong><small>XINGXU ENERGY TECHNOLOGY</small></div>
    </header>

    <section class="functional-intro feedback-intro">
      <p class="kicker"><span></span> NEEDS · FEEDBACK</p>
      <h1 id="feedback-title">把需求说清楚<br><em>方案才能做准</em></h1>
      <p>填写应用场景、当前问题和期望结果，我们据此判断后续沟通方向。</p>
    </section>

    <form class="feedback-sheet" id="feedback-form" novalidate>
      <fieldset>
        <legend>需求方向 <small>必选</small></legend>
        <div class="need-grid">
          <label><input type="radio" name="needType" value="能源模型" required><span>能源模型</span></label>
          <label><input type="radio" name="needType" value="数智软件"><span>数智软件</span></label>
          <label><input type="radio" name="needType" value="教学实验"><span>教学实验</span></label>
          <label><input type="radio" name="needType" value="技术服务"><span>技术服务</span></label>
        </div>
      </fieldset>

      <label class="field-label" for="contact-way">联系方式 <small>必填</small></label>
      <input id="contact-way" name="contactWay" type="text" maxlength="60" autocomplete="tel" placeholder="手机号或微信号" required>

      <label class="field-label" for="need-description">需求说明 <small>必填</small></label>
      <textarea id="need-description" name="description" maxlength="600" placeholder="请简要说明使用场景、当前问题和期望结果" required></textarea>

      <p class="form-safety"><i aria-hidden="true">!</i> 请勿填写账号、密码、API Key 或未脱敏的现场数据。</p>
      <button class="submit-button" type="submit"><span>提交需求反馈</span><b aria-hidden="true">→</b></button>
      <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
    </form>

    <div class="page-toast" role="status" aria-live="polite"></div>
  </main>
<script src="/assets/8a43679f2fae9338e8382ea8.js"></script>
</body>
</html>
