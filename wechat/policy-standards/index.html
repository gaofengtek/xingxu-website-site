<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="星旭新能源标准法规：核对能源政策、法规与标准的文件身份、实施状态和适用范围。">
  <title>标准法规｜星旭新能源</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../column-shell.css">
  <link rel="stylesheet" href="../column-mobile-overrides.css?v=20260905-1">
</head>
<body class="policy" data-column="policy-standards">
  <main class="page" aria-label="标准法规">
    <header class="hero">
      <div class="hero-copy">
        <div class="kicker">标准法规</div>
        <h1>读懂文件要求<br><span>看清实施边界</span></h1>
        <p>核对政策、法规与标准的文件身份、当前状态、适用对象和工程影响。</p>
      </div>
      <div class="signal" aria-hidden="true"><span class="signal-core">文件</span><b>类型</b><b>状态</b><b>对象</b><b>节点</b></div>
    </header>
    <div class="content">
      <section class="policy-intro-compact" aria-labelledby="intro-title">
        <span class="badge">栏目说明</span>
        <h2 id="intro-title">先确认文件，再解读影响</h2>
        <p>每篇只讲一份文件或一个明确议题，注明官方原文、文件状态、适用范围，并把文件事实与技术解读分开。</p>
      </section>
      <div class="section-head"><h2>最新文件</h2><span>以官方原文为准</span></div>
      <section class="empty" aria-label="暂无公开解读">
        <div class="empty-icon" aria-hidden="true">§</div><h3>暂无公开解读</h3><p>完成原文核对、内容审核和发布确认后，文件解读将在这里更新。</p>
      </section>
      <p class="policy-update-note"><strong>更新原则</strong> 发布不等于实施；地方规则不直接外推为全国要求。</p>
    </div>
    <footer class="site-footer">西安星旭新能源科技有限公司<br>标准法规信息以主管部门及标准发布机构原文为准</footer>
  </main>
</body>
</html>
